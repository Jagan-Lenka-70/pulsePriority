<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PulsePriority Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-bg">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card card-dark border-0 shadow-lg login-card">
        <div class="card-body p-4 p-md-5">
            <h1 class="h4 text-light mb-1"><i class="bi bi-heart-pulse-fill me-2"></i>PulsePriority EMS</h1>
            <p class="text-light-emphasis mb-4">Medical staff secure access portal</p>

            <div class="alert alert-danger py-2" th:if="${param.error}">
                Invalid username or password.
            </div>
            <div class="alert alert-success py-2" th:if="${param.logout}">
                You have logged out successfully.
            </div>

            <form th:action="@{/login}" method="post" class="d-grid gap-3">
                <div>
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text" class="form-control" required>
                </div>
                <div>
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password" class="form-control" required>
                </div>
                <button class="btn btn-primary">
                    <i class="bi bi-shield-lock-fill me-1"></i>Sign In
                </button>
            </form>

            <div class="mt-3 small text-light-emphasis">
                Demo credentials: <span class="text-light">doctor / doctor123</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
